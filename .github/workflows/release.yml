name: Build release images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
# Official action major tags are pinned but UNVERIFIED against the network.
# No deploy step: the Director has not selected or approved a deployment target.
jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
  images:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image namespace
        id: names
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.names.outputs.base }}/api:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          tags: ${{ steps.names.outputs.base }}/dashboard:${{ github.ref_name }}
