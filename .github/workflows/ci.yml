name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
# Official action major tags are pinned but UNVERIFIED against the network.
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: dashboard
      - run: npm run check
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --env-file .env.example config -q
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dashboard/Dockerfile
          push: false
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: dashboard
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: dashboard
