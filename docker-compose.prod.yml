# Use with docker-compose.yml; Docker Compose 2.24.4+ is required.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  mongo:
    ports: !reset []
    environment:
      # The local Docker Desktop rseq workaround is not a production default.
      GLIBC_TUNABLES: !reset null
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g
    cpus: 2
  redis:
    ports: !reset []
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 1
  api:
    image: ghcr.io/${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/api:${IMAGE_TAG:?Set IMAGE_TAG}
    build: !reset null
    ports: !reset []
    env_file: !reset []
    environment: &runtime_options
      PORT: '3000'
      SPEND_CAP_USD: ${SPEND_CAP_USD:-2}
      USER_KEY_TTL_SECONDS: ${USER_KEY_TTL_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      PERPLEXITY_MODEL: ${PERPLEXITY_MODEL:-perplexity/sonar}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-60000}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-4}
      RETRY_BASE_MS: ${RETRY_BASE_MS:-2000}
      RETRY_MAX_MS: ${RETRY_MAX_MS:-60000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      LIVE_CALL_RESERVE_USD: ${LIVE_CALL_RESERVE_USD:-0.05}
      # Pass through only these optional keys. Missing keys stay absent, not empty.
      OPENAI_API_KEY:
      PERPLEXITY_API_KEY:
      GEMINI_API_KEY:
      ANTHROPIC_API_KEY:
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 1
  worker:
    image: ghcr.io/${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/api:${IMAGE_TAG:?Set IMAGE_TAG}
    build: !reset null
    env_file: !reset []
    environment: *runtime_options
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    cpus: 2
  dashboard:
    image: ghcr.io/${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}/dashboard:${IMAGE_TAG:?Set IMAGE_TAG}
    build: !reset null
    ports: !reset []
    env_file: !reset []
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 1
  caddy:
    image: caddy:2
    ports: ['80:80', '443:443']
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      dashboard: { condition: service_healthy }
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    cpus: 1

volumes:
  # An incident restore selects a new volume explicitly; the old one survives.
  mongo_data:
    name: ${MONGO_VOLUME_NAME:-crowdreply_mongo_data}
  caddy_data:
  caddy_config:
